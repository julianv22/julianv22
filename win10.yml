services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      CPU_CORES: "4"
      RAM_SIZE: "8G"      
      USERNAME: "Julian-V"
      PASSWORD: "123456"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./shares:/data
    restart: always
    stop_grace_period: 2m
