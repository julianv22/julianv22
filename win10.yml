services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: "Julian-V"
      PASSWORD: "123456"
      RAM_SIZE: "4G"
      CPU_CORES: "16"
      DISK_SIZE: "256G"
      DISK2_SIZE: "256G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    restart: always
    stop_grace_period: 2ms